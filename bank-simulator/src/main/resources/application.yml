server:
  shutdown: graceful
  port: ${SERVER_PORT:8083}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 40s
  application:
    name: bank-simulator

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs/bank/ui
  api-docs:
    path: /docs/bank/v3/api-docs

bank:
  api-key: ${BANK_API_KEY}
  webhook-secret: ${BANK_WEBHOOK_SECRET}
  webhook-url: ${BANK_WEBHOOK_URL}

spring.jackson.deserialization.accept-float-as-int: false

spring.jackson.mapper.allow-coercion-of-scalars: false
