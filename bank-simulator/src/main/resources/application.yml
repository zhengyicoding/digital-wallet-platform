server:
  shutdown: graceful
  port: ${SERVER_PORT:8083}

spring:
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 40s
  application:
    name: bank-simulator

logging:
  structured:
    format:
      console: ecs

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      service: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s,30s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs/bank/ui
  api-docs:
    path: /docs/bank/v3/api-docs

bank:
  api-key: ${BANK_API_KEY}
  webhook-secret: ${BANK_WEBHOOK_SECRET}
  webhook-url: ${BANK_WEBHOOK_URL}

spring.jackson.deserialization.accept-float-as-int: false

spring.jackson.mapper.allow-coercion-of-scalars: false
