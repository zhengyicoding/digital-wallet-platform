worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream auth {
        server auth-service:8081;
    }
    upstream wallet {
        server wallet-service:8082;
    }
    upstream bank {
        server bank-simulator:8083;
    }
    upstream notifications {
        server notification-service:8084;
    }

    server {
        listen 8080;

        location = /healthz {
            access_log off;
            return 204;
        }

        # Static frontend
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # auth-service
        location /api/v1/auth/ {
            proxy_pass http://auth;
        }
        location /.well-known/jwks.json {
            proxy_pass http://auth;
        }
        location /docs/auth/ {
            proxy_pass http://auth;
        }

        # notification-service
        location /api/v1/notifications {
            proxy_pass http://notifications;
        }
        location /docs/notifications/ {
            proxy_pass http://notifications;
        }

        # wallet-service (catch-all for /api/v1/**)
        location /api/v1/ {
            proxy_pass http://wallet;
        }
        location /docs/wallet/ {
            proxy_pass http://wallet;
        }

        # bank-simulator admin
        location /bank/admin/ {
            proxy_pass http://bank;
        }
        location /docs/bank/ {
            proxy_pass http://bank;
        }
    }
}
