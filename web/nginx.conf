worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Resolve service names per request through Docker's embedded DNS, so a recreated or restarted
    # container's new address is picked up without reloading nginx (OPS-1, OPS-3).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # Variable proxy_pass disables proxy_redirect's default rewrite. Forward the client's Host so the
    # services' absolute redirects (Swagger UI) point at the edge address the client used.
    proxy_set_header Host $http_host;

    server {
        listen 8080;

        # No URI part in these values: nginx forwards the original request URI unchanged, as the previous
        # upstream form did.
        set $auth_up          http://auth-service:8081;
        set $wallet_up        http://wallet-service:8082;
        set $bank_up          http://bank-simulator:8083;
        set $notifications_up http://notification-service:8084;

        location = /healthz {
            access_log off;
            return 204;
        }

        # Static frontend
        location = /config.json {
            alias /tmp/wallet-config.json;
            default_type application/json;
            add_header Cache-Control "no-store";
        }
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # auth-service
        location /api/v1/auth/ {
            proxy_pass $auth_up;
        }
        location /docs/auth/ {
            proxy_pass $auth_up;
        }

        # notification-service
        location /api/v1/notifications {
            proxy_pass $notifications_up;
        }
        location /docs/notifications/ {
            proxy_pass $notifications_up;
        }

        # wallet-service (catch-all for /api/v1/**)
        location /api/v1/ {
            proxy_pass $wallet_up;
        }
        location /docs/wallet/ {
            proxy_pass $wallet_up;
        }

        # bank-simulator admin
        location /bank/admin/ {
            proxy_pass $bank_up;
        }
        location /docs/bank/ {
            proxy_pass $bank_up;
        }
    }
}
