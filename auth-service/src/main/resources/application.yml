server:
  shutdown: graceful
  port: ${SERVER_PORT:8081}

spring:
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 40s
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DB_USER:auth_user}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

logging:
  structured:
    format:
      console: ecs

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      service: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s,30s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /docs/auth/ui
  api-docs:
    path: /docs/auth/v3/api-docs

auth:
  login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
  login-window: ${LOGIN_WINDOW:1m}
  admin-username: ${ADMIN_USERNAME}
  admin-password: ${ADMIN_PASSWORD}
  issuer: ${JWT_ISSUER:digital-wallet-auth}
