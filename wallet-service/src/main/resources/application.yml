server:
  shutdown: graceful
  port: ${SERVER_PORT:8082}

spring:
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 40s
  task:
    scheduling:
      pool:
        size: 2
  application:
    name: wallet-service
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[enable.idempotence]": true
        "[max.block.ms]": 3000
        "[request.timeout.ms]": 3000
        "[delivery.timeout.ms]": 10000
  datasource:
    url: ${WALLET_DB_URL:jdbc:postgresql://localhost:5432/wallet_db}
    username: ${WALLET_DB_USER:wallet_user}
    password: ${WALLET_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

logging:
  structured:
    format:
      console: ecs

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      service: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s,30s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /docs/wallet/ui
  api-docs:
    path: /docs/wallet/v3/api-docs

wallet:
  reconciliation:
    pending-age: ${RECONCILIATION_PENDING_AGE:30s}
    interval: ${RECONCILIATION_INTERVAL:10s}
  issuer: ${JWT_ISSUER:digital-wallet-auth}
  jwks-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  min-amount: ${WALLET_MIN_AMOUNT:1}
  max-amount: ${WALLET_MAX_AMOUNT:200000}
  daily-limit: ${WALLET_DAILY_LIMIT:500000}

bank:
  base-url: ${BANK_BASE_URL:http://localhost:8083}
  api-key: ${BANK_API_KEY}
  webhook-secret: ${BANK_WEBHOOK_SECRET}
  timeout: ${BANK_TIMEOUT:3s}
  # RES-3 circuit breaker: count-based window; timeouts, connection errors, 5xx and raw cancellations are failures.
  circuit:
    sliding-window-size: ${BANK_CIRCUIT_WINDOW:10}
    minimum-number-of-calls: ${BANK_CIRCUIT_MIN_CALLS:5}
    failure-rate-threshold: ${BANK_CIRCUIT_FAILURE_RATE:50}
    wait-duration-in-open-state: ${BANK_CIRCUIT_OPEN_WAIT:15s}
    permitted-calls-in-half-open-state: ${BANK_CIRCUIT_HALF_OPEN_CALLS:2}
    automatic-transition-to-half-open: ${BANK_CIRCUIT_AUTO_HALF_OPEN:true}
